services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    environment:
      DATABASE_URL: sqlite:////app/data/app.db
      AUTO_SEED_REAL_SOURCES: "false"
    volumes:
      - app_data:/app/data

volumes:
  app_data:
